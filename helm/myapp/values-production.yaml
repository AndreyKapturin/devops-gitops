# Production-переопределения. Теги образов бампает CI (code-репо) через yq:
#   yq e -i '.backend.image.tag = "sha-<sha>"'  helm/myapp/values-production.yaml
#   yq e -i '.frontend.image.tag = "sha-<sha>"' helm/myapp/values-production.yaml
# После коммита (через PR) ArgoCD синкает новый тег в кластер.
#
# /health отдаёт APP_VERSION = backend.image.tag — агент сверяет его с sha коммита week7.
backend:
  image:
    tag: "sha-5be3a324018cf920cbfa216f7ad001b99e572f79"
frontend:
  image:
    tag: "sha-5be3a324018cf920cbfa216f7ad001b99e572f79"
hpa:
  enabled: true
monitoring:
  enabled: true
